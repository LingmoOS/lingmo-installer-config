---
# 注意：目录名是字面量（Calamares 不展开 shell 变量）。当前：core.lm
# 与 lingmo-builder 的 LB_LIVE_DIR 必须一致。
# 层集合由 lingmo-builder 的分层钩子恒定生成（空层也会生成）⇒ 这里可静态列出。
# ⚠️ 增减层时必须同步改：lingmo-builder 的 layer-images.conf + 钩子里的 ORDER + 本文件。
#
# optional: true 只给 firmware/apps/vendor/device 这四个附加层加：钩子对 ORDER 里每一层
# 都无条件 mksquashfs（空层也生成），正常构建下 9 个 .img 一定齐全，这四个只是安全余量；
# 基础层（system/kernel/desktop/lingmo/misc）故意不加 optional，缺了就明确报错，不静默跳过。

unpack:
    -   source: "/run/live/medium/core.lm/system.img"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/live/medium/core.lm/firmware.img"
        sourcefs: "squashfs"
        destination: ""
        optional: true
    -   source: "/run/live/medium/core.lm/kernel.img"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/live/medium/core.lm/desktop.img"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/live/medium/core.lm/lingmo.img"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/live/medium/core.lm/apps.img"
        sourcefs: "squashfs"
        destination: ""
        optional: true
    -   source: "/run/live/medium/core.lm/vendor.img"
        sourcefs: "squashfs"
        destination: ""
        optional: true
    -   source: "/run/live/medium/core.lm/device.img"
        sourcefs: "squashfs"
        destination: ""
        optional: true
    -   source: "/run/live/medium/core.lm/misc.img"
        sourcefs: "squashfs"
        destination: ""
