---
# 注意：目录名是字面量（Calamares 不展开 shell 变量）。当前：core.lm
# 与 lingmo-builder 的 LB_LIVE_DIR 必须一致。
# 层集合由 lingmo-builder 的分层钩子恒定生成（空层也会生成），因此这里可以静态列出。
# 顺序不重要（overlay 层序由 core.lm/core.module 决定），但保持与 core.module 一致更清晰。
unpack:
    -   source: "/run/live/medium/core.lm/system.img"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/live/medium/core.lm/vendor.img"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/live/medium/core.lm/device.img"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/live/medium/core.lm/kernel.img"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/live/medium/core.lm/boot.img"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/live/medium/core.lm/misc.img"
        sourcefs: "squashfs"
        destination: ""
