---
# Enable lingmo-dm as the display manager on the installed system, and
# enable the first-boot OOBE service that runs oobe.sh setup before the
# display manager starts on first boot.  lingmo-dm's Alias keeps the
# display-manager.service symlink working; firstboot.service writes
# /etc/lingmo-dm.conf with the autologin user so the DM logs straight
# into the OOBE session on first boot.
units:
  - name:      "lingmo-dm.service"
    action:    "enable"
    mandatory: true

  - name:      "firstboot.service"
    action:    "enable"
    mandatory: true

  - name:      "NetworkManager.service"
    action:    "enable"
    mandatory: false
